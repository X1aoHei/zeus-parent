server:
  port: 8080

log:
  home: ${LOG_HOME:${user.home}/logs}

spring:
  application:
    name: zeus-data-exchange-center-example
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://129.203.128.194:3306/app?serverTimezone=PRC&useUnicode=true&characterEncoding=utf8&nullNamePatternMatchesAll=true&rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:wss}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:129.203.128.194}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:wang0826}
      database: ${REDIS_DATABASE:0}

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:129.203.128.194:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

zeus:
  export:
    mq-transaction-enabled: false
  file:
    local:
      enabled: true
      base-path: ${FILE_LOCAL_BASE_PATH:${user.home}/zeus-export}
      url-prefix: ${FILE_LOCAL_URL_PREFIX:}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:zeus-data-exchange-center-producer}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
